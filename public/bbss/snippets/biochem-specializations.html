<!-- ============================================================
     BBSS — Biochemistry Specializations Flowchart (horizontal)
     Paste this whole block into a Squarespace Code Block.
     To edit the content, change the DATA array near the top of the script.
     ============================================================ -->
<bbss-biochem-specializations></bbss-biochem-specializations>
<script>
(function () {
  if (customElements.get('bbss-biochem-specializations')) return; // guard vs double-paste

  // ---- CUSTOMIZE: palette ---------------------------------------------------
  var NAVY = '#1D1F3E';   // headings, start node, detail labels
  var BODY = '#242636';   // body text
  var ACCENT = {
    green:  '#8AB976',
    blue:   '#97A6D8',
    orange: '#F38D6D',
    pink:   '#E39EBB'
  };

  // ---- CUSTOMIZE: the specializations --------------------------------------
  // Card face is intentionally standardized (name + gate badge). All the detail
  // lives in the dropdown, and every card uses the SAME field labels.
  var START = 'Level II Biochemistry';

  // ==== DATA START ====
  var DATA = [
    {
      name: 'Biochemistry Core',
      gate: 'No application required',
      color: ACCENT.green,
      details: [
        { label: 'Overview', value: 'Default path, with automatic enrolment and the most room for electives.' },
        { label: 'Entry year', value: 'Level III (automatic if not specializing)' },
        { label: 'Application', value: 'None required' },
        { label: 'Prerequisites', value: 'None' },
        { label: 'Program length', value: '4 years' },
        { label: 'Highlights', value: 'Core courses cover the degree requirements; optional thesis or project (BIOCHEM 3A03, 3R03, 4F09, 4C03).' }
      ]
    },
    {
      name: 'Biomedical Research Specialization',
      gate: 'Supplementary application',
      color: ACCENT.blue,
      details: [
        { label: 'Overview', value: 'Research-intensive path with heavy lab work and a senior thesis.' },
        { label: 'Entry year', value: 'Level III' },
        { label: 'Application', value: 'Supplementary application plus a research course permission form.' },
        { label: 'Prerequisites', value: 'Identify a lab or professor during 2nd year; start looking early.' },
        { label: 'Program length', value: '4 years' },
        { label: 'Highlights', value: 'Up to 21 units of advanced lab experience; at least 3 units of lab or research courses in 3rd year plus a senior thesis in 4th year.' }
      ]
    },
    {
      name: 'Biochemistry Co-op',
      gate: 'OSCARplus application',
      color: ACCENT.orange,
      details: [
        { label: 'Overview', value: 'Adds paid, full-time work terms to the degree.' },
        { label: 'Entry year', value: 'Level III' },
        { label: 'Application', value: 'Apply through OSCARplus.' },
        { label: 'Prerequisites', value: 'Complete SCIENCE 2C00; minimum 6.0 GPA.' },
        { label: 'Program length', value: '5 years' },
        { label: 'Highlights', value: '16 months of work (two 8-month or four 4-month terms) across 3rd to 5th year in industry, academia, government, or hospitals.' }
      ]
    },
    {
      name: 'Biomedical Discovery & Commercialization',
      gate: 'Supplementary application + interview',
      color: ACCENT.pink,
      details: [
        { label: 'Overview', value: 'Blends drug discovery science with commerce and business.' },
        { label: 'Entry year', value: 'Level III' },
        { label: 'Application', value: 'Supplementary application plus an interview.' },
        { label: 'Prerequisites', value: 'Competitive admission; cohort of 50 to 60 students.' },
        { label: 'Program length', value: '4 years, with an optional accelerated 1-year Master’s.' },
        { label: 'Highlights', value: 'Science plus business curriculum; the Master’s option includes a 4 to 12 month internship.' }
      ]
    }
  ];
  // ==== DATA END ====

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  class BBSSBiochem extends HTMLElement {
    connectedCallback() {
      var root = this.attachShadow({ mode: 'open' });
      root.innerHTML =
        '<style>' +
        ':host{display:block;font-family:inherit;color:' + BODY + ';' +
          '--navy:' + NAVY + ';--body:' + BODY + ';--line:rgba(29,31,62,.28);--r:10px;}' +
        '*{box-sizing:border-box;}' +
        '.wrap{max-width:960px;margin:0 auto;}' +
        '.flow{display:flex;align-items:center;}' +
        // intro column (start node only)
        '.intro{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:160px;}' +
        '.node{background:var(--navy);color:#fff;font-weight:700;padding:.7rem 1rem;' +
          'border-radius:var(--r);text-align:center;line-height:1.25;width:100%;}' +
        // branches column (the four cards) + connectors
        '.branches{position:relative;flex:1 1 auto;margin-left:64px;display:flex;flex-direction:column;gap:14px;}' +
        '.trunk{position:absolute;left:-64px;width:32px;height:2px;background:var(--line);}' +
        '.rail{position:absolute;left:-32px;width:2px;background:var(--line);}' +
        '.stub{position:absolute;left:-32px;width:32px;height:2px;background:var(--line);}' +
        '.card{position:relative;background:#fff;border:1px solid rgba(29,31,62,.12);' +
          'border-left:5px solid var(--c);border-radius:var(--r);overflow:hidden;}' +
        '.head{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:.8rem 1rem;}' +
        '.head:focus-visible{outline:2px solid var(--navy);outline-offset:-2px;}' +
        '.gate{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.02em;' +
          'text-transform:uppercase;color:var(--navy);background:var(--c);padding:.22rem .5rem;border-radius:6px;}' +
        '.name{display:block;margin:.5rem 0 0;font-size:1.02rem;font-weight:700;' +
          'color:var(--navy);line-height:1.25;}' +
        '.toggle{display:inline-flex;align-items:center;gap:.4rem;margin-top:.5rem;' +
          'font-size:.82rem;font-weight:700;color:var(--navy);}' +
        '.chev{transition:transform .2s ease;font-size:.7rem;}' +
        '.head[aria-expanded="true"] .chev{transform:rotate(90deg);}' +
        '.details{padding:0 1rem 1rem;font-size:.86rem;}' +
        '.details[hidden]{display:none;}' +
        '.details dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.4rem .9rem;}' +
        '.details dt{font-weight:700;color:var(--navy);}' +
        '.details dd{margin:0;line-height:1.5;color:var(--body);}' +
        // mobile: stack vertically, hide horizontal connectors
        '@media(max-width:640px){' +
          '.flow{flex-direction:column;align-items:stretch;}' +
          '.intro{width:auto;}' +
          '.branches{margin-left:0;margin-top:18px;}' +
          '.trunk,.rail,.stub{display:none;}' +
          '.details dl{grid-template-columns:1fr;gap:.15rem;}' +
          '.details dt{margin-top:.5rem;}' +
        '}' +
        '</style>' +
        '<div class="wrap"><div class="flow">' +
          '<div class="intro">' +
            '<div class="node">' + esc(START) + '</div>' +
          '</div>' +
          '<div class="branches">' +
            '<div class="trunk"></div><div class="rail"></div>' +
            DATA.map(cardHTML).join('') +
          '</div>' +
        '</div></div>';

      var self = this;
      var heads = root.querySelectorAll('.head');
      heads.forEach(function (h) {
        h.addEventListener('click', function () {
          var open = h.getAttribute('aria-expanded') === 'true';
          h.setAttribute('aria-expanded', open ? 'false' : 'true');
          root.getElementById(h.getAttribute('aria-controls')).hidden = open;
          self._layout();
        });
      });

      this._root = root;
      this._layout();
      // re-measure after fonts settle and on resize
      setTimeout(function () { self._layout(); }, 60);
      this._onResize = function () { self._layout(); };
      window.addEventListener('resize', this._onResize);
    }

    disconnectedCallback() {
      if (this._onResize) window.removeEventListener('resize', this._onResize);
    }

    // Position the connector lines. Each card keeps its own branch line into the
    // vertical rail, and the whole assembly re-measures whenever a card expands.
    _layout() {
      var root = this._root; if (!root) return;
      var branches = root.querySelector('.branches');
      var cards = Array.prototype.slice.call(root.querySelectorAll('.card'));
      if (!cards.length) return;

      cards.forEach(function (card) {
        var head = card.querySelector('.head');
        card.querySelector('.stub').style.top =
          (head.offsetTop + head.offsetHeight / 2) + 'px';
      });

      var first = cards[0], last = cards[cards.length - 1];
      var y1 = first.offsetTop + first.querySelector('.head').offsetHeight / 2;
      var y2 = last.offsetTop + last.querySelector('.head').offsetHeight / 2;
      var rail = root.querySelector('.rail');
      rail.style.top = y1 + 'px';
      rail.style.height = (y2 - y1) + 'px';

      // feeder line from the start node's vertical centre into the rail
      var node = root.querySelector('.node');
      var br = branches.getBoundingClientRect();
      var nr = node.getBoundingClientRect();
      root.querySelector('.trunk').style.top =
        ((nr.top + nr.height / 2) - br.top) + 'px';
    }
  }

  function cardHTML(d, i) {
    var pid = 'bbss-d' + i;
    var rows = d.details.map(function (r) {
      return '<dt>' + esc(r.label) + '</dt><dd>' + esc(r.value) + '</dd>';
    }).join('');
    return '<article class="card" style="--c:' + d.color + '">' +
      '<span class="stub"></span>' +
      '<button class="head" aria-expanded="false" aria-controls="' + pid + '">' +
        '<span class="gate">' + esc(d.gate) + '</span>' +
        '<span class="name">' + esc(d.name) + '</span>' +
        '<span class="toggle"><span class="chev">▶</span> Details</span>' +
      '</button>' +
      '<div class="details" id="' + pid + '" hidden><dl>' + rows + '</dl></div>' +
    '</article>';
  }

  customElements.define('bbss-biochem-specializations', BBSSBiochem);
})();
</script>
